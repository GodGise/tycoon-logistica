name: Aggiorna prezzi settimanali

on:
  schedule:
    - cron: "17 7 * * 2"   # ogni martedì alle 7:17 UTC (il report GME esce il lunedì)
  workflow_dispatch:        # avvio a mano dalla scheda Actions

permissions:
  contents: write

jobs:
  prezzi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf==5.1.0
      - run: python scripts/aggiorna_prezzi.py --out prezzi.json
      - name: Salva prezzi.json se è cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add prezzi.json
          git diff --cached --quiet || git commit -m "Prezzi della settimana"
          git push
