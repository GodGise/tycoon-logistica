<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1c1c1e">
<title>Tycoon Logistica</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="mappa" aria-label="Mappa di Udine"></div>
<div id="avviso-mappa" hidden></div>

<aside class="pannello" aria-label="Pannello di gestione">
  <header class="testa">
    <div class="marchio"><span class="logo" id="logo" aria-hidden="true">TL</span><div><strong id="nome-azienda">Tycoon Logistica</strong><small id="sotto-marchio">nome del gioco provvisorio</small></div></div>
    <div class="cassa-box">
      <span class="etichetta">Cassa</span>
      <span id="cassa" class="cifra-grande">–</span>
      <span id="utile-mese" class="sotto">–</span>
    </div>
  </header>
  <nav class="schede" role="tablist">
    <button role="tab" data-scheda="azienda" aria-selected="true">Azienda</button>
    <button role="tab" data-scheda="attivita">Attività</button>
    <button role="tab" data-scheda="conti">Conti</button>
    <button role="tab" data-scheda="flotta">Flotta</button>
    <button role="tab" data-scheda="personale">Personale</button>
  </nav>
  <section id="contenuto" class="contenuto" role="tabpanel"></section>
</aside>

<div class="hud">
  <div class="data-box"><span id="data">–</span><span id="ora">–</span></div>
  <div class="prossimo"><span class="etichetta">Fine giornata tra</span><span id="countdown">2:30</span></div>
  <div class="barra-giorno"><i id="barra-giorno"></i></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="js/dati.js"></script>
<script src="js/citta.js"></script>
<script src="js/gioco.js"></script>
<script src="js/mappa.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
