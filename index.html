<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1c1c1e">
<title>Tycoon Logistica</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css?v=dev">
</head>
<body>
<!-- filtro di rifrazione per l'effetto vetro liquido (usato solo dai browser che lo supportano) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rifrazione" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="rumore"/>
    <feGaussianBlur in="rumore" stdDeviation="2" result="morbido"/>
    <feDisplacementMap in="SourceGraphic" in2="morbido" scale="38" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div id="mappa" aria-label="Mappa di Udine"></div>
<div id="avviso-mappa" hidden></div>

<aside class="pannello vetro" aria-label="Pannello di gestione">
  <header class="testa">
    <div class="marchio"><span class="logo" id="logo" aria-hidden="true">TL</span><div><strong id="nome-azienda">Tycoon Logistica</strong><small id="sotto-marchio">nome del gioco provvisorio</small></div></div>
    <div class="cassa-box">
      <span class="etichetta">Cassa</span>
      <span id="cassa" class="cifra-grande">–</span>
      <span id="utile-mese" class="sotto">–</span>
    </div>
  </header>
  <nav class="schede" role="tablist"><span class="indicatore" aria-hidden="true"></span>
    <button role="tab" data-scheda="azienda" aria-selected="true">Azienda</button>
    <button role="tab" data-scheda="giri">Giri</button>
    <button role="tab" data-scheda="attivita">Attività</button>
    <button role="tab" data-scheda="conti">Conti</button>
    <button role="tab" data-scheda="flotta">Flotta</button>
    <button role="tab" data-scheda="personale">Personale</button>
  </nav>
  <section id="contenuto" class="contenuto" role="tabpanel"></section>
</aside>

<div class="hud vetro">
  <div class="data-box"><span id="data">–</span><span id="ora">–</span></div>
  <div class="prossimo"><span class="etichetta">Fine giornata tra</span><span id="countdown">2:30</span></div>
  <div class="barra-giorno"><i id="barra-giorno"></i></div>
</div>
<div id="offerta" class="offerta vetro" role="dialog" aria-label="Nuova offerta di contratto" hidden></div>
<div id="finestra" class="finestra" role="dialog" aria-modal="false" hidden></div>
<div id="toast" class="vetro" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="js/dati.js?v=dev"></script>
<script src="js/citta.js?v=dev"></script>
<script src="js/gioco.js?v=dev"></script>
<script src="js/contratti.js?v=dev"></script>
<script src="js/eventi.js?v=dev"></script>
<script src="js/mappa.js?v=dev"></script>
<script src="js/ui.js?v=dev"></script>
</body>
</html>
