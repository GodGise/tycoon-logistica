<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1c1c1e">
<title>Tycoon Logistica</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icona-180.png">
<meta name="apple-mobile-web-app-title" content="Tycoon">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css?v=dev">
</head>
<body data-foglio="medio">
<div id="mappa" aria-label="Mappa di Udine"></div>
<div id="avviso-mappa" hidden></div>

<aside class="pannello vetro" aria-label="Pannello di gestione" data-foglio="medio">
  <button class="maniglia" type="button" aria-label="Allarga o riduci il pannello"></button>
  <header class="testa">
    <div class="marchio"><span class="logo" id="logo" aria-hidden="true">TL</span><div><strong id="nome-azienda">Tycoon Logistica</strong><small id="sotto-marchio">nome del gioco provvisorio</small></div></div>
    <div class="cassa-box">
      <span class="etichetta">Cassa</span>
      <span id="cassa" class="cifra-grande">–</span>
      <span id="utile-mese" class="sotto">–</span>
    </div>
  </header>
  <nav class="schede" role="tablist"><span class="indicatore" aria-hidden="true"></span>
    <button role="tab" data-scheda="giri">Giri</button>
    <button role="tab" data-scheda="attivita">Attività</button>
    <button role="tab" data-scheda="conti">Conti</button>
    <button role="tab" data-scheda="flotta">Flotta</button>
    <button role="tab" data-scheda="personale">Personale</button>
    <button role="tab" data-scheda="posta">Posta<span class="pallino-posta" hidden></span></button>
  </nav>
  <section id="contenuto" class="contenuto" role="tabpanel"></section>
</aside>

<div class="hud vetro">
  <div class="data-box"><span id="data">–</span><span id="ora">–</span></div>
  <div class="prossimo"><span class="etichetta">Fine giornata tra</span><span id="countdown">10:00</span></div>
  <div class="barra-giorno"><i id="barra-giorno"></i></div>
</div>
<div id="guasti" class="guasti" aria-live="polite"></div>
<button id="pulsante-azienda" class="pulsante-azienda" aria-label="Azienda e magazzini" hidden>
  <span class="icona-az" id="logo-az">TL</span><span class="testo-az"><b>Azienda</b><small id="mag-az">–</small></span><i class="pallino-az" hidden></i>
</button>
<button id="pulsante-impostazioni" class="pulsante-azienda pulsante-imp" aria-label="Impostazioni" hidden>
  <span class="icona-az"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>
  <span class="testo-az"><b>Impostazioni</b><small>account, logo, salva</small></span>
</button>
<div id="offerta" class="offerta vetro" role="dialog" aria-label="Nuova offerta di contratto" hidden></div>
<div id="finestra" class="finestra" role="dialog" aria-modal="false" hidden></div>
<div id="toast" class="vetro" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="js/dati.js?v=dev"></script>
<script src="js/citta.js?v=dev"></script>
<script src="js/gioco.js?v=dev"></script>
<script src="js/contratti.js?v=dev"></script>
<script src="js/eventi.js?v=dev"></script>
<script src="js/dettagli.js?v=dev"></script>
<script src="js/traguardi.js?v=dev"></script>
<script src="js/posta.js?v=dev"></script>
<script src="js/livelli.js?v=dev"></script>
<script src="js/stelle.js?v=dev"></script>
<script src="js/sedi.js?v=dev"></script>
<script src="js/mappa.js?v=dev"></script>
<script src="js/online.js?v=dev"></script>
<script src="js/notifiche.js?v=dev"></script>
<script src="js/ui.js?v=dev"></script>
</body>
</html>
